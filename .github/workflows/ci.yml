name: Python CI Pipeline


on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: repository_kod_letoltes
      uses: actions/checkout@v4


    - name: python_beallitas
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

  
    - name: letoltes
      run: |
        pip install -r requirements.txt

    - name: pytest_futtatas
      run: |
        pytest lab_3_pipeline -v
